[project]
name = "pykoclaw-matrix"
version = "0.1.0"
description = "Matrix/Element plugin for pykoclaw"
requires-python = ">=3.12"
dependencies = ["pykoclaw", "pykoclaw-messaging", "matrix-nio[e2e]>=0.25.2", "click", "canonicaljson>=2.0.0", "httpx", "markdown-it-py>=3.0", "mdit-py-plugins>=0.4", "linkify-it-py>=2.0", "mermaid-cli>=0.1", "playwright==1.57.0"]

[tool.uv.sources]
pykoclaw = { workspace = true }
pykoclaw-messaging = { workspace = true }

[project.entry-points."pykoclaw.plugins"]
matrix = "pykoclaw_matrix:MatrixPlugin"

[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=0.25.0",
]
